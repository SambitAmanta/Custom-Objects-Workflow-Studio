name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge_db
          POSTGRES_USER: forge_user
          POSTGRES_PASSWORD: forge_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check apps tests
          ruff format --check apps tests

      - name: Run Django Migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: forge_db
          POSTGRES_USER: forge_user
          POSTGRES_PASSWORD: forge_password
          MONGO_URI: mongodb://localhost:27017/forge_test
        run: |
          python apps/api/manage.py migrate

      - name: Run Test Suites & Invariant Matrix
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: forge_db
          POSTGRES_USER: forge_user
          POSTGRES_PASSWORD: forge_password
          MONGO_URI: mongodb://localhost:27017/forge_test
        run: |
          pytest -v
