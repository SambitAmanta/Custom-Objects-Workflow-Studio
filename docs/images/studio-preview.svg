<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" border-bottom="1px solid #334155" />
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-width="1" />
  
  <circle cx="36" cy="30" r="14" fill="url(#accent)" />
  <text x="36" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
  <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Forge Studio</text>
  <text x="175" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">v1.0.0 (Tenant: acme-corp)</text>

  <!-- Role Selector Pill -->
  <rect x="940" y="15" width="220" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <circle cx="956" cy="31" r="5" fill="#22c55e" />
  <text x="970" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Role: Admin (Active)</text>

  <!-- Main 3-Column Layout -->
  
  <!-- Left Panel: Schema Designer -->
  <rect x="24" y="80" width="360" height="570" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
  <rect x="24" y="80" width="360" height="48" rx="12" fill="#1e293b" />
  <text x="44" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">1. Schema Designer (invoice v1)</text>

  <!-- Schema Fields List -->
  <g transform="translate(44, 145)">
    <!-- Field 1 -->
    <rect x="0" y="0" width="320" height="54" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="14" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#60a5fa">invoice_number</text>
    <text x="14" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">text • required • unique (HMAC)</text>
    <rect x="255" y="12" width="52" height="22" rx="4" fill="#1e293b" />
    <text x="281" y="27" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">admin</text>

    <!-- Field 2 -->
    <rect x="0" y="66" width="320" height="54" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="14" y="90" font-family="monospace" font-size="13" font-weight="600" fill="#60a5fa">amount</text>
    <text x="14" y="108" font-family="sans-serif" font-size="11" fill="#94a3b8">number • min: 0 • validation rule</text>
    <rect x="255" y="78" width="52" height="22" rx="4" fill="#1e293b" />
    <text x="281" y="93" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">admin</text>

    <!-- Field 3 -->
    <rect x="0" y="132" width="320" height="54" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
    <text x="14" y="156" font-family="monospace" font-size="13" font-weight="600" fill="#f87171">tax_id</text>
    <text x="14" y="174" font-family="sans-serif" font-size="11" fill="#fca5a5">text • masked: editor • hidden: viewer</text>
    <rect x="240" y="144" width="68" height="22" rx="4" fill="#7f1d1d" />
    <text x="274" y="159" font-family="sans-serif" font-size="10" fill="#fecaca" text-anchor="middle">RBAC lock</text>

    <!-- Field 4 -->
    <rect x="0" y="198" width="320" height="54" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="14" y="222" font-family="monospace" font-size="13" font-weight="600" fill="#60a5fa">customer_name</text>
    <text x="14" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">text • required</text>

    <!-- Add Field Button -->
    <rect x="0" y="270" width="320" height="38" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-dasharray="4 4" />
    <text x="160" y="294" font-family="sans-serif" font-size="13" font-weight="500" fill="#60a5fa" text-anchor="middle">+ Add Custom Field</text>
  </g>

  <!-- Middle Panel: Workflow DAG Visualizer -->
  <rect x="408" y="80" width="380" height="570" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
  <rect x="408" y="80" width="380" height="48" rx="12" fill="#1e293b" />
  <text x="428" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">2. State Machine (Mermaid AST)</text>

  <!-- Graph Nodes & Connectors -->
  <g transform="translate(438, 160)">
    <!-- Node 1: Draft -->
    <rect x="90" y="0" width="140" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Draft</text>

    <!-- Arrow 1: Submit -->
    <line x1="160" y1="42" x2="160" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="175" y="72" font-family="monospace" font-size="10" fill="#94a3b8">submit</text>

    <!-- Node 2: Submitted -->
    <rect x="90" y="95" width="140" height="42" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="160" y="121" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Submitted</text>

    <!-- Branch Left: Approve -->
    <line x1="110" y1="137" x2="50" y2="200" stroke="#22c55e" stroke-width="2" />
    <text x="45" y="165" font-family="monospace" font-size="10" fill="#4ade80">approve (guard: &lt;= 10k)</text>

    <!-- Branch Right: Reject -->
    <line x1="210" y1="137" x2="270" y2="200" stroke="#ef4444" stroke-width="2" />
    <text x="250" y="165" font-family="monospace" font-size="10" fill="#f87171">reject</text>

    <!-- Node 3: Approved -->
    <rect x="0" y="200" width="120" height="40" rx="8" fill="#064e3b" stroke="#22c55e" stroke-width="1.5" />
    <text x="60" y="225" font-family="sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Approved</text>

    <!-- Node 4: Rejected -->
    <rect x="200" y="200" width="120" height="40" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="260" y="225" font-family="sans-serif" font-size="12" font-weight="600" fill="#fef2f2" text-anchor="middle">Rejected</text>

    <!-- Node 5: Paid -->
    <line x1="60" y1="240" x2="60" y2="295" stroke="#3b82f6" stroke-width="2" />
    <text x="75" y="272" font-family="monospace" font-size="10" fill="#93c5fd">pay</text>
    <rect x="0" y="295" width="120" height="40" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="60" y="320" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Paid (Terminal)</text>
  </g>

  <!-- Right Panel: Dynamic Record Explorer & Masking -->
  <rect x="812" y="80" width="364" height="570" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
  <rect x="812" y="80" width="364" height="48" rx="12" fill="#1e293b" />
  <text x="832" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">3. Record Explorer &amp; Masking</text>

  <!-- Dynamic Table -->
  <g transform="translate(832, 145)">
    <!-- Header -->
    <rect x="0" y="0" width="324" height="32" rx="4" fill="#0f172a" />
    <text x="10" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">INVOICE #</text>
    <text x="120" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">AMOUNT</text>
    <text x="210" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">TAX ID</text>

    <!-- Row 1 -->
    <rect x="0" y="38" width="324" height="40" rx="4" fill="#1e293b" />
    <text x="10" y="63" font-family="monospace" font-size="12" fill="#f8fafc">INV-2026-001</text>
    <text x="120" y="63" font-family="sans-serif" font-size="12" fill="#34d399">$2,500.00</text>
    <text x="210" y="63" font-family="monospace" font-size="11" fill="#cbd5e1">US-99182746</text>

    <!-- Row 2 -->
    <rect x="0" y="84" width="324" height="40" rx="4" fill="#0f172a" />
    <text x="10" y="109" font-family="monospace" font-size="12" fill="#f8fafc">INV-2026-002</text>
    <text x="120" y="109" font-family="sans-serif" font-size="12" fill="#34d399">$14,500.00</text>
    <text x="210" y="109" font-family="monospace" font-size="11" fill="#cbd5e1">US-88271635</text>

    <!-- Row 3 (Editor View Simulation Callout) -->
    <rect x="0" y="130" width="324" height="40" rx="4" fill="#1e293b" />
    <text x="10" y="155" font-family="monospace" font-size="12" fill="#f8fafc">INV-2026-003</text>
    <text x="120" y="155" font-family="sans-serif" font-size="12" fill="#34d399">$750.00</text>
    <text x="210" y="155" font-family="monospace" font-size="11" fill="#f87171">***MASKED***</text>

    <!-- OCC & ETag Indicator -->
    <rect x="0" y="200" width="324" height="80" rx="8" fill="#0f172a" stroke="#3b82f6" />
    <text x="14" y="224" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">ETag OCC Precondition Guard</text>
    <text x="14" y="244" font-family="monospace" font-size="11" fill="#94a3b8">ETag: W/"2" • If-Match enforced</text>
    <text x="14" y="264" font-family="sans-serif" font-size="11" fill="#34d399">✓ 0 lost updates across 50 concurrent VUs</text>
  </g>
</svg>

